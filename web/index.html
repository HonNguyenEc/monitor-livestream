<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livestream QC Demo</title>
  <style>
    :root{
      --bg:#f4f6fa;--surface:#fff;--surface-2:#f2f5fa;--surface-3:#e8edf5;--border:#e0e5ed;--border-strong:#c9d1de;
      --text:#172235;--muted:#4d5b70;--faint:#59677b;--accent:#294f9b;--accent-hover:#203f7b;
      --ok-bg:#e4f5eb;--ok:#176a3a;--warn-bg:#fff2d6;--warn:#855600;--danger-bg:#fde9eb;--danger:#a62c3a;
      --radius:16px;--radius-sm:10px;--gap:18px;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);font-synthesis:none
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 10% 0%,#e8eef9 0,transparent 38%),var(--bg)}
    [hidden]{display:none!important}
    button,input{font:inherit;color:inherit}
    button{border:1px solid var(--border-strong);background:var(--surface-2);border-radius:var(--radius-sm);padding:9px 13px;font-size:13px;font-weight:650;cursor:pointer}
    button:hover{background:var(--surface-3)}
    button:disabled{opacity:.72;cursor:wait}
    button.primary{border-color:var(--accent);background:var(--accent);color:#fff}
    button.primary:hover{background:var(--accent-hover)}
    button.danger{border-color:#7a2a3b;background:var(--danger-bg);color:var(--danger)}
    button:focus-visible,input:focus-visible,.shop-item:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .shell{max-width:1320px;margin:auto;padding:36px 24px 56px}
    .app-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    h1{font-size:28px;letter-spacing:-.035em;margin:0 0 5px}
    .sub{color:var(--muted);font-size:13px}
    .summary{color:var(--muted);font-size:13px;margin-top:8px}

    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:var(--gap)}
    .tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted)}
    .tab:hover{background:none;color:var(--text)}
    .tab--active{color:var(--text);border-bottom-color:var(--accent)}
    .tab-count{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--surface-2);font-size:11px}

    .layout{display:grid;grid-template-columns:1fr;gap:var(--gap)}
    .sidebar,.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:0}
    .sidebar{display:flex;flex-direction:column}
    .sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--border)}
    .sidebar-head h2{font-size:14px;margin:0}
    .shop-list{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:5px;max-height:40vh;overflow:auto}
    .shop-item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:none;padding:10px;border-radius:var(--radius-sm)}
    .shop-item:hover{background:var(--surface-2)}
    .shop-item--active{background:#edf2fb;border-color:#9fb4d8}
    .shop-item-main{flex:1;min-width:0}
    .shop-item-name{display:block;font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .shop-item-meta{display:block;color:var(--muted);font-size:12px;margin-top:3px}
    .dot{width:9px;height:9px;border-radius:50%;background:#aeb8c7;flex:none;box-shadow:0 0 0 3px #eef1f5}
    .dot--ok{background:#2fd08e}.dot--warn{background:#f0b44c}.dot--busy{background:var(--accent)}
    .list-empty{color:var(--muted);font-size:13px;padding:18px 10px;text-align:center}
    .list-legend{display:flex;gap:12px;flex-wrap:wrap;padding:11px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
    .legend-item{display:inline-flex;align-items:center;gap:6px}.legend-item .dot{width:7px;height:7px}


    .panel{padding:24px;box-shadow:0 10px 32px rgba(28,43,68,.05)}
    .panel-empty{color:var(--muted);text-align:center;padding:60px 10px}
    .media{position:relative;background:linear-gradient(145deg,#202c3e,#111a28);aspect-ratio:16/9;max-height:50vh;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:#c0cada;font-size:13px}
    .media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .overlay{position:absolute;left:12px;top:12px;display:flex;gap:7px;z-index:1}
    .badge{font-size:11px;font-weight:750;letter-spacing:.03em;padding:6px 9px;border-radius:99px;background:#36445d;color:#d8e1f1}
    .badge--ok{background:var(--ok-bg);color:var(--ok)}.badge--warn{background:var(--warn-bg);color:var(--warn)}.badge--live{background:#a32c42;color:#fff}

    .panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:20px 0 8px}
    .panel-title{font-size:22px;font-weight:730;letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}
    .panel-platform{color:var(--muted);font-size:12px;margin-top:3px}
    .panel-time{font-size:11px;color:var(--faint);white-space:nowrap}
    .detail{font-size:14px;color:var(--text);line-height:1.55;margin:0 0 4px;min-height:20px;overflow-wrap:anywhere}
    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
    .actions button{flex:0 1 auto;min-width:150px}

    .config{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
    .config h3{font-size:14px;margin:0 0 12px}
    .form-grid{display:grid;grid-template-columns:1fr;gap:12px}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
    .field input{width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--bg);font-size:14px}
    .field input:invalid:not(:placeholder-shown){border-color:#a0465a}
    .field--wide{grid-column:1/-1}
    .field-hint{font-size:12px;color:var(--muted);margin-top:5px}
    .req{color:var(--danger)}
    .form-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
    .form-actions .spacer{flex:1}

    .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;background:var(--surface-3);border:1px solid var(--border-strong);box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10}
    .toast--error{background:var(--danger-bg);border-color:#7a2a3b;color:var(--danger)}
    .toast--ok{background:var(--ok-bg);border-color:#1f7a59;color:var(--ok)}

    @media (min-width:640px){
      .shell{padding:28px 24px 48px}
      .form-grid{grid-template-columns:1fr 1fr}
    }
    @media (min-width:1024px){
      .layout{grid-template-columns:300px minmax(0,1fr);align-items:start}
      .sidebar{position:sticky;top:16px;max-height:calc(100vh - 32px)}
      .shop-list{max-height:none;flex:1}
    }
    @media (max-width:639px){
      .app-header{flex-direction:column;align-items:stretch}
      .panel-head{flex-direction:column}
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="app-header">
    <div>
      <h1>Livestream QC</h1>
      <div class="sub">Quản lý và theo dõi trạng thái phát trực tiếp trên các nền tảng</div>
      <div id="summary" class="summary">Đang tải dữ liệu…</div>
    </div>
    <button id="monitor" class="primary" type="button">Bắt đầu theo dõi tất cả các kênh liên tục</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Nền tảng">
    <button class="tab" role="tab" type="button" data-tab="tiktok" id="tab-tiktok" aria-controls="layout">TikTok<span class="tab-count" id="count-tiktok">0</span></button>
    <button class="tab" role="tab" type="button" data-tab="shopee" hidden id="tab-shopee" aria-controls="layout">Shopee<span class="tab-count" id="count-shopee">0</span></button>
  </nav>

  <main class="layout" id="layout" role="tabpanel">
    <aside class="sidebar" aria-labelledby="list-title">
      <div class="sidebar-head">
        <h2 id="list-title">Danh sách kênh</h2>
        <button id="add-shop" type="button">+ Thêm kênh</button>
      </div>
      <ul id="shop-list" class="shop-list"></ul>
      <div class="list-legend" aria-label="Chú giải trạng thái">
        <span class="legend-item"><i class="dot dot--ok"></i> Đang live</span>
        <span class="legend-item"><i class="dot dot--busy"></i> Đang kiểm tra</span>
        <span class="legend-item"><i class="dot dot--warn"></i> Cần kiểm tra</span>
      </div>
    </aside>

    <section class="panel" aria-live="polite">
      <div id="panel-empty" class="panel-empty">Chọn một kênh để xem trạng thái và thông tin cấu hình.</div>

      <div id="panel-view" hidden>
        <div class="media">
          <span id="media-empty">Chưa có hình ảnh gần nhất</span>
          <div class="overlay"><span id="status-badge" class="badge"></span></div>
        </div>
        <div class="panel-head">
          <div><h2 id="panel-title" class="panel-title"></h2><div id="panel-platform" class="panel-platform"></div></div>
          <div id="panel-time" class="panel-time"></div>
        </div>
        <p id="detail" class="detail"></p>
                <div id="actions" class="actions">
          <button type="button" class="primary" data-action="mpv" id="mpv-button">Bắt đầu theo dõi liên tục</button>
        </div>
      </div>

      <form id="shop-form" class="config" novalidate hidden>
        <h3 id="form-title">Thông tin kênh</h3>
        <div id="form-fields" class="form-grid"></div>
        <div class="form-actions">
          <button type="submit" class="primary" id="form-save">Lưu</button>
          <button type="button" id="form-cancel">Huỷ</button>
          <span class="spacer"></span>
          <button type="button" class="danger" id="form-delete">Xoá kênh</button>
        </div>
      </form>
    </section>
  </main>

</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
// Shopee tab is hidden for now; add `shopee: 'Shopee'` back (and unhide #tab-shopee) to re-enable it.
const PLATFORMS = {tiktok: 'TikTok'};
const FIELDS = {
  tiktok: [
    {name: 'username', label: 'Username TikTok', required: true, placeholder: 'vd: frisovietnam', hint: 'Không cần dấu @.'},
    {name: 'live_url', label: 'Link live (tuỳ chọn)', type: 'url', placeholder: 'https://www.tiktok.com/@…/live'},
  ],
  shopee: [
    {name: 'cookie', label: 'Cookie Seller Center', required: true, secret: true, wide: true, type: 'password',
     placeholder: 'SPC_SC_SESSION=…; SC_SSO=…',
     hint: 'Header “cookie” của một request tới banhang.shopee.vn. Chỉ SPC_SC_SESSION được lưu; tên và ID bên dưới tự điền.'},
    {name: 'name', label: 'Tên hiển thị (tuỳ chọn)', placeholder: 'Tự lấy từ Seller Center'},
    {name: 'user_id', label: 'User ID (tuỳ chọn)', numeric: true, placeholder: 'Tự lấy từ cookie'},
    {name: 'shop_id', label: 'Shop ID (tuỳ chọn)', numeric: true, placeholder: 'Tự lấy từ cookie'},
    {name: 'live_url', label: 'Link share live (tuỳ chọn)', type: 'url', placeholder: 'https://live.shopee.vn/share?from=live&session=…',
     hint: 'Để trống để tự tìm phiên đang live của shop.'},
  ],
};
const MPV_ACTIVE = ['retrying', 'checking_image', 'playing', 'stopping'];
// Verdicts come from each shop's mpv job: `live` means mpv is playing a stream with real frames,
// `offline` means the platform says the shop is not live.
const STATUS_TEXT = {live: 'ĐANG LIVE', offline: 'KHÔNG LIVE', no_signal: 'MẤT TÍN HIỆU', unknown: 'CHƯA XÁC ĐỊNH',
                     checking: 'ĐANG KẾT NỐI', not_checked: 'CHƯA THEO DÕI'};
const STATUS_BADGE = {live: 'badge--live', no_signal: 'badge--warn', unknown: 'badge--warn'};

const state = {tab: 'tiktok', selected: {tiktok: null, shopee: null}, creating: false,
               shops: [], monitoring: false, messages: {}, loaded: false};
let toastTimer = null;
const $ = id => document.getElementById(id);

try {
  const saved = JSON.parse(localStorage.getItem('qc-ui') || '{}');
  if (PLATFORMS[saved.tab]) state.tab = saved.tab;
  if (saved.selected) Object.assign(state.selected, saved.selected);
} catch (e) { /* storage unavailable: use defaults */ }

function persist() {
  try { localStorage.setItem('qc-ui', JSON.stringify({tab: state.tab, selected: state.selected})); } catch (e) { /* ignore */ }
}
function esc(x) { return String(x ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }
function clock(s) { return new Date(s).toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit', second: '2-digit'}); }
function showTime(s) { return s ? 'Kiểm tra ' + clock(s) : 'Chưa kiểm tra'; }
function tabShops() { return state.shops.filter(s => s.platform === state.tab); }
function currentShop() { return state.shops.find(s => s.key === state.selected[state.tab] && s.platform === state.tab) || null; }

function toast(message, kind = '') {
  const el = $('toast');
  el.textContent = message;
  el.className = 'toast' + (kind ? ' toast--' + kind : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

async function withBusy(button, busyText, task) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = busyText;
  try { return await task(); } finally { button.disabled = false; button.textContent = original; }
}

async function api(path, body) {
  const options = {method: body === undefined ? 'GET' : 'POST', cache: 'no-store'};
  if (body !== undefined && body !== null) {
    options.headers = {'Content-Type': 'application/json'};
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  let data = {};
  try { data = await response.json(); } catch (e) { /* non-JSON body */ }
  if (!response.ok) throw new Error(data.message || data.error || `Lỗi máy chủ (${response.status})`);
  return data;
}

// ---- Data ---------------------------------------------------------------

async function load() {
  try {
    const data = await api('/api/shops');
    state.shops = data.shops.filter(s => PLATFORMS[s.platform]);
    state.monitoring = data.monitoring;
    const firstLoad = !state.loaded;
    state.loaded = true;
    for (const platform of Object.keys(PLATFORMS)) {
      const list = state.shops.filter(s => s.platform === platform);
      if (!list.some(s => s.key === state.selected[platform])) state.selected[platform] = list[0]?.key || null;
    }
    render({form: firstLoad});
  } catch (e) {
    $('summary').textContent = 'Không tải được dữ liệu: ' + e.message;
  }
}

// ---- Rendering ----------------------------------------------------------

function render({form = false} = {}) {
  renderHeader();
  renderList();
  renderPanel();
  if (form) renderForm();
}

function renderHeader() {
  const live = state.shops.filter(s => s.status === 'live').length;
  $('summary').textContent = `${state.shops.length} kênh · ${live} đang live · ${state.monitoring ? 'Đang theo dõi liên tục' : 'Chưa theo dõi'}`;
  const button = $('monitor');
  if (!button.disabled) button.textContent = state.monitoring ? 'Dừng theo dõi' : 'Bắt đầu theo dõi tất cả các kênh liên tục';
  button.classList.toggle('primary', !state.monitoring);
  for (const platform of Object.keys(PLATFORMS)) {
    const tab = $('tab-' + platform);
    const active = platform === state.tab;
    tab.classList.toggle('tab--active', active);
    tab.setAttribute('aria-selected', String(active));
    $('count-' + platform).textContent = state.shops.filter(s => s.platform === platform).length;
  }
}

function missingCookie(s) { return s.platform === 'shopee' && !s.cookie_set; }

function dotClass(s) {
  if (missingCookie(s)) return 'dot--warn';
  if (s.status === 'live') return 'dot--ok';
  if (s.status === 'checking') return 'dot--busy';
  if (s.status === 'no_signal' || s.status === 'unknown' || s.mpv_state === 'error') return 'dot--warn';
  return '';
}

function itemMeta(s) {
  if (missingCookie(s)) return 'thiếu cookie Seller Center';
  const text = STATUS_TEXT[s.status] ? STATUS_TEXT[s.status].toLowerCase() : s.status;
  if (s.status === 'live' && s.live_since) return `${text} từ ${clock(s.live_since)}`;
  return MPV_ACTIVE.includes(s.mpv_state) && s.status !== 'live' ? `${text} · lần thử ${s.mpv_attempts || 0}` : text;
}

function renderList() {
  $('list-title').textContent = `Kênh ${PLATFORMS[state.tab]}`;
  const list = tabShops();
  const selected = state.creating ? null : state.selected[state.tab];
  $('shop-list').innerHTML = list.length ? list.map(s => `
    <li><button type="button" class="shop-item ${s.key === selected ? 'shop-item--active' : ''}" data-key="${esc(s.key)}" aria-current="${s.key === selected}">
      <span class="dot ${dotClass(s)}" aria-hidden="true"></span>
      <span class="shop-item-main"><span class="shop-item-name">${esc(s.label)}</span><span class="shop-item-meta">${esc(itemMeta(s))}</span></span>
    </button></li>`).join('')
    : `<li class="list-empty">Chưa có kênh ${PLATFORMS[state.tab]}. Bấm “+ Thêm kênh”.</li>`;
}

function detailText(s) {
  if (MPV_ACTIVE.includes(s.mpv_state) || s.mpv_state === 'error') return s.mpv_message || '';
  return state.messages[s.key] || 'Chưa theo dõi. Bấm nút bên dưới để mở mpv cho kênh này.';
}

function renderPanel() {
  const shop = state.creating ? null : currentShop();
  $('panel-empty').hidden = !!shop || state.creating;
  $('panel-empty').textContent = tabShops().length ? 'Chọn một kênh bên trái để xem trạng thái và cấu hình.' : 'Chưa có kênh nào trên nền tảng này.';
  $('panel-view').hidden = !shop;
  $('shop-form').hidden = !shop && !state.creating;
  if (!shop) return;

  const badge = $('status-badge');
  badge.textContent = STATUS_TEXT[shop.status] || shop.status;
  badge.className = 'badge' + (STATUS_BADGE[shop.status] ? ' ' + STATUS_BADGE[shop.status] : '');
  $('panel-title').textContent = shop.label;
  $('panel-platform').textContent = PLATFORMS[shop.platform] || shop.platform;
  $('panel-time').textContent = (shop.live_since ? `Live từ ${clock(shop.live_since)} · ` : '') + showTime(shop.checked_at);
  $('detail').textContent = detailText(shop);

  const busy = MPV_ACTIVE.includes(shop.mpv_state);
  const mpvButton = $('mpv-button');
  if (!mpvButton.disabled) mpvButton.textContent = busy ? 'Dừng theo dõi liên tục' : 'Bắt đầu theo dõi liên tục';
  mpvButton.dataset.running = String(busy);

  const img = shop.frame ? snapshotImage() : $('snapshot');
  if (shop.frame && img.dataset.src !== shop.frame) { img.src = shop.frame; img.dataset.src = shop.frame; }
  if (img) img.hidden = !shop.frame;
  $('media-empty').hidden = !!shop.frame;
}

function renderForm() {
  const shop = state.creating ? null : currentShop();
  const platform = state.tab;
  const config = shop ? shop.config : {};
  $('form-title').textContent = shop ? 'Thông tin kênh' : `Thêm kênh ${PLATFORMS[platform]}`;
  $('form-delete').hidden = !shop;
  $('form-cancel').hidden = !!shop;
  $('form-fields').innerHTML = FIELDS[platform].map(f => {
    // Secrets are never sent back to the page; once saved, leaving the field empty keeps them.
    const stored = f.secret && shop?.cookie_set;
    const required = f.required && !stored;
    const placeholder = stored ? 'Đã lưu — dán cookie mới để thay' : f.placeholder || '';
    const value = f.secret ? '' : config[f.name] ?? '';
    return `
    <div class="field${f.wide ? ' field--wide' : ''}">
      <label for="f-${f.name}">${esc(f.label)}${required ? ' <span class="req">*</span>' : ''}</label>
      <input id="f-${f.name}" name="${f.name}" type="${f.type || 'text'}" ${f.numeric ? 'inputmode="numeric" pattern="[0-9]+"' : ''}
        ${f.secret ? 'autocomplete="off"' : ''} ${required ? 'required' : ''} placeholder="${esc(placeholder)}" value="${esc(value)}">
      ${f.hint ? `<div class="field-hint">${esc(f.hint)}</div>` : ''}
    </div>`;
  }).join('');
}

// Created on first use so the page never ships an <img> without a source.
function snapshotImage() {
  let img = $('snapshot');
  if (!img) {
    img = new Image();
    img.id = 'snapshot';
    img.alt = 'Ảnh chụp gần nhất từ mpv';
    img.hidden = true;
    $('media-empty').after(img);
  }
  return img;
}

// ---- Selection ----------------------------------------------------------

function selectTab(platform) {
  if (platform === state.tab) return;
  state.tab = platform;
  state.creating = false;
  persist();
  render({form: true});
}

function selectShop(key) {
  if (key === state.selected[state.tab] && !state.creating) return;
  state.selected[state.tab] = key;
  state.creating = false;
  persist();
  render({form: true});
}

// ---- Shop actions -------------------------------------------------------

function setMessage(key, text) {
  state.messages[key] = text;
  if (currentShop()?.key === key) $('detail').textContent = text;
}

async function toggleMpv(key, running) {
  await api(`/api/mpv/${running ? 'stop' : 'start'}/${encodeURIComponent(key)}`, null);
  await load();
}

const ACTIONS = {
  mpv: {busy: 'Đang xử lý…', run: (key, btn) => toggleMpv(key, btn.dataset.running === 'true')},
};

$('actions').addEventListener('click', async event => {
  const button = event.target.closest('button[data-action]');
  const shop = currentShop();
  if (!button || !shop) return;
  const action = ACTIONS[button.dataset.action];
  try {
    await withBusy(button, action.busy, () => action.run(shop.key, button));
  } catch (e) {
    setMessage(shop.key, e.message);
    toast(e.message, 'error');
  }
  renderPanel();
});

// ---- Config forms -------------------------------------------------------

$('shop-form').addEventListener('submit', async event => {
  event.preventDefault();
  const form = event.currentTarget;
  const invalid = [...form.querySelectorAll('input')].find(input => !input.checkValidity());
  if (invalid) {
    const label = form.querySelector(`label[for="${invalid.id}"]`).textContent.replace('*', '').trim();
    toast(invalid.validity.valueMissing ? `Vui lòng nhập ${label}.` : `${label} không hợp lệ.`, 'error');
    invalid.focus();
    return;
  }
  const shop = {platform: state.tab};
  for (const input of form.querySelectorAll('input')) shop[input.name] = input.value.trim();
  const originalKey = state.creating ? null : state.selected[state.tab];
  try {
    const result = await withBusy($('form-save'), 'Đang lưu…', () => api('/api/shops/save', {original_key: originalKey, shop}));
    state.selected[state.tab] = result.data.key;
    state.creating = false;
    persist();
    toast(result.message, 'ok');
    await load();
    renderForm();
  } catch (e) {
    toast(e.message, 'error');
  }
});

$('form-delete').addEventListener('click', async () => {
  const shop = currentShop();
  if (!shop || !confirm(`Xoá shop “${shop.label}” khỏi cấu hình?`)) return;
  try {
    const result = await withBusy($('form-delete'), 'Đang xoá…', () => api('/api/shops/delete/' + encodeURIComponent(shop.key), null));
      state.selected[state.tab] = null;
    persist();
    toast(result.message, 'ok');
    await load();
    renderForm();
  } catch (e) {
    toast(e.message, 'error');
  }
});

$('form-cancel').addEventListener('click', () => {
  state.creating = false;
  render({form: true});
});

$('add-shop').addEventListener('click', () => {
  state.creating = true;
  render({form: true});
  $('shop-form').querySelector('input')?.focus();
});

// ---- Navigation & polling ----------------------------------------------

document.querySelector('.tabs').addEventListener('click', event => {
  const tab = event.target.closest('[data-tab]');
  if (tab) selectTab(tab.dataset.tab);
});

$('shop-list').addEventListener('click', event => {
  const item = event.target.closest('[data-key]');
  if (item) selectShop(item.dataset.key);
});

$('monitor').addEventListener('click', async () => {
  const starting = !state.monitoring;
  try {
    await withBusy($('monitor'), starting ? 'Đang bắt đầu…' : 'Đang dừng…', () =>
      api('/api/monitor/' + (starting ? 'start' : 'stop'), starting ? {platforms: Object.keys(PLATFORMS)} : null));
    toast(starting ? 'Đã bắt đầu theo dõi. Trạng thái cập nhật sau mỗi lượt kiểm tra.' : 'Đã dừng theo dõi.', 'ok');
  } catch (e) {
    toast(e.message, 'error');
  }
  await load();
});

load();
setInterval(load, 5000);
</script>
</body>
</html>
